{% extends 'layout.html' %} {% block body %}
<h1>Dashboard <small class="text-muted">Welcome {{session.username}}</small></h1>
<a class="btn btn-success mb-3" href="/add_article"> Add Article</a>
<hr />
<div class="table-responsive">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for article in articles %}
      <tr>
        <td>{{article[0]}}</td>
        <td>{{article[1]}}</td>
        <td>{{article[2]}}</td>
        <td>{{article[4]}}</td>
        <td>
          <div class="btn-group" role="group" aria-label="Article actions">
            <a href="article/{{article[0]}}" class="btn btn-info btn-sm">View</a>
            <a href="edit_article/{{article[0]}}" class="btn btn-outline-secondary btn-sm">Edit</a>
            <form action="{{url_for('delete_article', id=article[0])}}" method="post" class="d-inline">
              <input type="hidden" name="_method" value="DELETE" />
              <input type="submit" value="Delete" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this article?')" />
            </form>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
