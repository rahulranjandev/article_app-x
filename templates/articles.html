{% extends 'layout.html' %} {% block body %}
<h1 class="mb-4">Articles</h1>
<div class="list-group">
  {% for article in articles %}
  <a href="article/{{article[0]}}" class="list-group-item list-group-item-action">
    <h5 class="mb-1">{{article[1]}}</h5>
    <small class="text-muted">By {{article[2]}} on {{article[4]}}</small>
  </a>
  {% endfor%}
</div>
{% endblock %}
