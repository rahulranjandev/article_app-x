{% extends 'layout.html' %} {% block body %}
<div class="row justify-content-center">
  <div class="col-md-10">
    <h1 class="mb-3">{{article[1]}}</h1>
    <p class="text-muted mb-4">
      <small>Written by <strong>{{article[2]}}</strong> on {{article[4]}}</small>
    </p>
    <hr />
    <div class="article-content">{{article[3] | safe}}</div>
    <hr class="mt-4" />
    <a href="/articles" class="btn btn-secondary">← Back to Articles</a>
  </div>
</div>
{% endblock %}
